[plugin]
name = "Kubernetes"
description = "Pods, services, deployments, logs, and namespace management"
version = "0.2.0"
author = "larkline"
icon = "☸"
icon_nerd = "󱃾"
category = "dev"

[[commands]]
name = "Pods"
description = "All pods across namespaces with logs and describe"
entry = "pods.lua"
quickkey = "kp"
timeout_seconds = 15
prefetch = true
widget = true
widget_refresh_secs = 30

[[commands]]
name = "Deployments"
description = "Deployment status and scaling"
entry = "deployments.lua"
quickkey = "kd"
timeout_seconds = 15
widget = true
widget_refresh_secs = 30

[[commands]]
name = "Services"
description = "Services across namespaces"
entry = "services.lua"
quickkey = "ks"
timeout_seconds = 15
prefetch = true

[[commands]]
name = "Namespaces"
description = "Namespace picker and resource counts"
entry = "namespaces.lua"
quickkey = "kn"
timeout_seconds = 10

[[commands]]
name = "Logs"
description = "Stream logs from a selected pod"
entry = "logs.lua"
quickkey = "kl"
timeout_seconds = 30

[[commands]]
name = "Contexts"
description = "Switch kubectl context"
entry = "contexts.lua"
timeout_seconds = 10
