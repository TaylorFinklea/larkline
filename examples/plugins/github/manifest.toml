[plugin]
name = "GitHub"
description = "PRs, reviews, CI/CD, issues, and notifications"
version = "0.3.0"
author = "larkline"
icon = "🐙"
icon_nerd = "󰊤"
category = "dev"
secrets = ["GITHUB_TOKEN"]

[[settings]]
id = "max_runs"
label = "Max Workflow Runs"
type = "select"
options = ["10", "25", "50"]
default = "25"

[[settings]]
id = "show_drafts"
label = "Show Draft PRs"
type = "toggle"
default = "false"

[[commands]]
name = "My PRs"
description = "Open pull requests you authored with merge/close actions"
entry = "my-prs.lua"
quickkey = "gp"
timeout_seconds = 15
prefetch = true
widget = true
widget_refresh_secs = 60

[[commands]]
name = "Review Requests"
description = "PRs requesting your review with approve/comment actions"
entry = "reviews.lua"
quickkey = "gr"
timeout_seconds = 15
prefetch = true
widget = true
widget_refresh_secs = 60

[[commands]]
name = "Notifications"
description = "Unread GitHub notifications"
entry = "notifications.lua"
quickkey = "gn"
timeout_seconds = 15
widget = true
widget_refresh_secs = 120

[[commands]]
name = "Issues"
description = "Open issues assigned to you"
entry = "issues.lua"
quickkey = "gi"
timeout_seconds = 15
widget = true
widget_refresh_secs = 120

[[commands]]
name = "Workflow Runs"
description = "Recent GitHub Actions runs across your repos"
entry = "workflows.lua"
quickkey = "gw"
timeout_seconds = 30
widget = true
widget_refresh_secs = 60
