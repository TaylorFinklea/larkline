[plugin]
name = "GitHub"
description = "PRs, reviews, and CI/CD workflow runs"
version = "0.2.0"
author = "larkline"
icon = "🐙"
icon_nerd = ""
category = "dev"
secrets = ["GITHUB_TOKEN"]

[[settings]]
id = "max_runs"
label = "Max Workflow Runs"
type = "select"
options = ["10", "25", "50"]
default = "25"

[[settings]]
id = "show_drafts"
label = "Show Draft PRs"
type = "toggle"
default = "false"

[[commands]]
name = "My PRs"
description = "Open pull requests you authored"
entry = "my-prs.lua"
quickkey = "gp"
timeout_seconds = 15

[[commands]]
name = "Review Requests"
description = "PRs requesting your review"
entry = "reviews.lua"
timeout_seconds = 15

[[commands]]
name = "Workflow Runs"
description = "Recent GitHub Actions runs across your repos"
entry = "workflows.lua"
quickkey = "gw"
timeout_seconds = 30
