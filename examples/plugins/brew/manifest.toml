[plugin]
name = "Brew"
description = "Manage Homebrew packages"
version = "0.2.0"
author = "larkline"
icon = "🍺"
icon_nerd = ""
category = "dev"

[[commands]]
name = "Packages"
description = "Installed Homebrew formulae"
entry = "init.lua"
timeout_seconds = 15
prefetch = true

[[commands]]
name = "Update"
description = "Check for outdated packages"
entry = "update.lua"
timeout_seconds = 30
