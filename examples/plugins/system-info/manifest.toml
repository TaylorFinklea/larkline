[plugin]
name = "System Info"
description = "CPU, memory, and disk usage at a glance"
version = "0.1.0"
author = "taylor"
icon = "💻"
icon_nerd = "󰍹"
entry = "run.sh"
timeout_seconds = 5

category = "system"

# Agent-callable: read-only, zero-arg, no secrets — an ideal first tool
# for the in-app AI agent. Not destructive (just reports stats).
agent_callable = true
destructive = false
