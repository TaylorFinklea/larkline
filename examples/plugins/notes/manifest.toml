[plugin]
name = "Notes"
description = "Search, browse, and open Obsidian/markdown vault notes"
version = "0.1.0"
author = "larkline"
icon = "📝"
icon_nerd = "󱞁"
category = "productivity"

[[commands]]
name = "Search"
description = "Full-text search across vault notes"
entry = "search.lua"
quickkey = "ns"
timeout_seconds = 10

[[commands]]
name = "Recent"
description = "Recently modified notes"
entry = "recent.lua"
quickkey = "nr"
timeout_seconds = 5
prefetch = true
widget = true
widget_refresh_secs = 120

[[commands]]
name = "Browse"
description = "Browse vault folders and files"
entry = "browse.lua"
quickkey = "nb"
timeout_seconds = 5

[[commands]]
name = "Settings"
description = "Configure vault path"
entry = "settings.lua"
timeout_seconds = 5
