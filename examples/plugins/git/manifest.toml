[plugin]
name = "Git"
description = "Git dashboard across your repos"
version = "0.3.0"
author = "taylor"
icon = "🌿"
icon_nerd = "󰊢"
category = "dev"

[[commands]]
name = "Status"
description = "Working tree status, ahead/behind, stash count"
entry = "status.lua"
quickkey = "gs"
timeout_seconds = 15
prefetch = true
widget = true
widget_refresh_secs = 30

[[commands]]
name = "Branches"
description = "All branches with checkout, pull, delete actions"
entry = "branches.lua"
quickkey = "gb"
timeout_seconds = 15
prefetch = true

[[commands]]
name = "Log"
description = "Recent commits with diff and cherry-pick actions"
entry = "log.lua"
quickkey = "gl"
timeout_seconds = 15

[[commands]]
name = "Stash"
description = "View and manage stashes — apply, pop, drop"
entry = "stash.lua"
timeout_seconds = 10

[[commands]]
name = "Manage Repos"
description = "Add or remove tracked repositories"
entry = "manage.lua"

[[commands]]
name = "Scan Directory"
description = "Auto-discover git repos in a directory"
entry = "scan.lua"
