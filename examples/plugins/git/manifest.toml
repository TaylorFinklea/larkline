[plugin]
name = "Git"
description = "Git dashboard across your repos"
version = "0.2.0"
author = "taylor"
icon = "🌿"
icon_nerd = "󰊢"
category = "dev"

[[commands]]
name = "Status"
description = "Working tree status across all tracked repos"
entry = "status.lua"
quickkey = "gs"
timeout_seconds = 15
prefetch = true
widget = true
widget_refresh_secs = 30

[[commands]]
name = "Branches"
description = "Current branch and last commit across repos"
entry = "branches.lua"
quickkey = "gb"
timeout_seconds = 15
prefetch = true

[[commands]]
name = "Manage Repos"
description = "Add or remove tracked repositories"
entry = "manage.lua"

[[commands]]
name = "Scan Directory"
description = "Auto-discover git repos in a directory"
entry = "scan.lua"
