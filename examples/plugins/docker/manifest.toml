[plugin]
name = "Docker"
description = "Full container management — containers, images, volumes, networks, compose, system"
version = "0.3.0"
author = "larkline"
icon = "🐳"
icon_nerd = "󰡨"
category = "dev"

[[commands]]
name = "Containers"
description = "Running and stopped containers with logs, exec, stats, start/stop"
entry = "containers.lua"
quickkey = "dc"
timeout_seconds = 10
prefetch = true
widget = true
widget_refresh_secs = 15

[[commands]]
name = "Compose"
description = "Compose stacks with up/down/restart/logs/ps"
entry = "compose.lua"
quickkey = "dd"
timeout_seconds = 15

[[commands]]
name = "Images"
description = "Local images with pull, remove, and prune"
entry = "images.lua"
quickkey = "di"
timeout_seconds = 10

[[commands]]
name = "Volumes"
description = "Volumes with inspect, remove, and prune"
entry = "volumes.lua"
quickkey = "dv"
timeout_seconds = 10

[[commands]]
name = "Networks"
description = "Docker networks with inspect and remove"
entry = "networks.lua"
quickkey = "dn"
timeout_seconds = 10

[[commands]]
name = "System"
description = "Disk usage, system info, prune all unused resources"
entry = "system.lua"
quickkey = "ds"
timeout_seconds = 15

[[commands]]
name = "Dashboard"
description = "Split-pane container overview (mini app)"
entry = "dashboard.lua"
quickkey = "db"
timeout_seconds = 15
mini_app = true
