[plugin]
name = "Docker"
description = "Manage containers, images, volumes, and Compose projects"
version = "0.2.0"
author = "larkline"
icon = "🐳"
icon_nerd = "󰡨"
category = "dev"

[[commands]]
name = "Containers"
description = "List all containers with start/stop/restart/logs actions"
entry = "containers.lua"
quickkey = "dc"
timeout_seconds = 10
prefetch = true
widget = true
widget_refresh_secs = 30

[[commands]]
name = "Images"
description = "List local Docker images with remove/inspect actions"
entry = "images.lua"
quickkey = "di"
timeout_seconds = 10

[[commands]]
name = "Volumes"
description = "List Docker volumes with inspect and prune"
entry = "volumes.lua"
quickkey = "dv"
timeout_seconds = 10

[[commands]]
name = "Compose"
description = "Detect Compose projects and manage services"
entry = "compose.lua"
quickkey = "dd"
timeout_seconds = 15
