[plugin]
name = "Mail"
description = "Apple Mail integration via osascript"
version = "0.1.0"
author = "larkline"
icon = "📬"
icon_nerd = "󰇮"
category = "tools"

[[commands]]
name = "Inbox"
description = "Recent messages across all accounts"
entry = "inbox.lua"
quickkey = "mi"
timeout_seconds = 30

[[commands]]
name = "Mail Search"
description = "Full-text search across all mailboxes"
entry = "search.lua"
quickkey = "ms"
timeout_seconds = 60

[[commands]]
name = "New Mail"
description = "Open a Mail.app composer pre-filled with recipient and subject"
entry = "compose.lua"
quickkey = "mc"
timeout_seconds = 60
