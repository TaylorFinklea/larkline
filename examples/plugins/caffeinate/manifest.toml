[plugin]
name = "Caffeinate"
description = "Keep your Mac awake — built-in macOS caffeinate"
version = "0.3.0"
author = "taylor"
icon = "☕"
icon_nerd = "󰛊"
category = "system"

[[commands]]
name = "Status"
description = "Current caffeinate status"
entry = "status.lua"
timeout_seconds = 5
prefetch = true
# Show a compact chip in the glance strip (e.g. "☕ 23m").
status = true
status_refresh_secs = 30

[[commands]]
name = "Start"
description = "Start caffeinate for N minutes"
entry = "start.lua"
timeout_seconds = 10

[[commands]]
name = "Extend"
description = "Extend current caffeinate session by N minutes"
entry = "extend.lua"
timeout_seconds = 10
