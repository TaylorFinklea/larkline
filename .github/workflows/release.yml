name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          ARCHIVE="lark-${VERSION}-${TARGET}.tar.gz"
          tar czf "${ARCHIVE}" -C "target/${TARGET}/release" lark
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lark-${{ matrix.target }}
          path: lark-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lark-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const tag = process.env.TAG;
            const runUrl = process.env.RUN_URL;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `crates.io publish failed for ${tag}`,
              body: [
                `The publish-crate job failed for tag \`${tag}\`.`,
                ``,
                `The GitHub release and Homebrew tap update proceeded;`,
                `only the crates.io publish did not. Re-publishing the same`,
                `version is not possible, so either investigate and cut a`,
                `patch release, or accept that this tag is crates.io-skipped.`,
                ``,
                `Run: ${runUrl}`,
              ].join('\n'),
              labels: ['release', 'publish-failure'],
            });

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute SHA256 values
        id: sha
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha_aarch64=$(shasum -a 256 "lark-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha_x86_64_mac=$(shasum -a 256 "lark-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha_x86_64_linux=$(shasum -a 256 "lark-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TAP_TOKEN }}
          script: |
            const version = '${{ steps.sha.outputs.version }}';
            const sha_aarch64 = '${{ steps.sha.outputs.sha_aarch64 }}';
            const sha_x86_64_mac = '${{ steps.sha.outputs.sha_x86_64_mac }}';
            const sha_x86_64_linux = '${{ steps.sha.outputs.sha_x86_64_linux }}';

            const formula = [
              '# Homebrew formula for larkline.',
              '#',
              '# Install: brew install TaylorFinklea/tap/larkline',
              '# Binary name: lark',
              '# After install: lark plugin sync',
              'class Larkline < Formula',
              '  desc "The line to all your tools — a keyboard-driven terminal command palette"',
              '  homepage "https://github.com/TaylorFinklea/larkline"',
              `  version "${version}"`,
              '  license "GPL-3.0-only"',
              '',
              '  on_macos do',
              '    if Hardware::CPU.arm?',
              '      url "https://github.com/TaylorFinklea/larkline/releases/download/v#{version}/lark-v#{version}-aarch64-apple-darwin.tar.gz"',
              `      sha256 "${sha_aarch64}"`,
              '    else',
              '      url "https://github.com/TaylorFinklea/larkline/releases/download/v#{version}/lark-v#{version}-x86_64-apple-darwin.tar.gz"',
              `      sha256 "${sha_x86_64_mac}"`,
              '    end',
              '  end',
              '',
              '  on_linux do',
              '    url "https://github.com/TaylorFinklea/larkline/releases/download/v#{version}/lark-v#{version}-x86_64-unknown-linux-gnu.tar.gz"',
              `    sha256 "${sha_x86_64_linux}"`,
              '  end',
              '',
              '  def install',
              '    bin.install "lark"',
              '  end',
              '',
              '  def caveats',
              '    <<~EOS',
              '      Run `lark plugin sync` to install the standard plugin library.',
              '    EOS',
              '  end',
              '',
              '  test do',
              '    assert_match version.to_s, shell_output("#{bin}/lark --version")',
              '  end',
              'end',
              '',
            ].join('\n');

            // Get current file SHA for update
            let fileSha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: 'TaylorFinklea',
                repo: 'homebrew-tap',
                path: 'Formula/larkline.rb',
              });
              fileSha = data.sha;
            } catch (e) {
              fileSha = undefined;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: 'TaylorFinklea',
              repo: 'homebrew-tap',
              path: 'Formula/larkline.rb',
              message: `Update larkline to v${version}`,
              content: Buffer.from(formula).toString('base64'),
              sha: fileSha,
            });

            console.log(`Updated homebrew-tap formula to v${version}`);
